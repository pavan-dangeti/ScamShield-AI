# Dependency updates arrive as pull requests, so pinned versions do not go stale
# and every upgrade must pass CI before it reaches the deployment.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
