name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Lint and dead-code check
        run: |
          ruff check src scripts tests
          vulture src scripts tests --min-confidence 80
      - name: Type check
        run: python -m mypy --explicit-package-bases --namespace-packages src scripts tests

  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Download licence-checked sources
        run: python -m scripts.download_data
      - name: Build corpus and verify no leakage
        run: |
          python -m scripts.build_dataset
          python -m scripts.check_leakage --threshold 0.90
      - name: Upload build stats
        uses: actions/upload-artifact@v4
        with:
          name: dataset-stats
          path: data/processed/stats.json
