name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Type check
        run: |
          pip install -q mypy types-requests
          python -m mypy --explicit-package-bases --namespace-packages \
            src/models/base.py src/models/tfidf.py src/models/onnx_infer.py \
            src/models/transformer_infer.py src/data.py src/taxonomy.py \
            src/detector.py src/model_registry.py src/models/llm_prompted.py

  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Download licence-checked sources
        run: python -m scripts.download_data
      - name: Build corpus and verify no leakage
        run: |
          python -m scripts.build_dataset
          python -m scripts.check_leakage --threshold 0.90
      - name: Upload build stats
        uses: actions/upload-artifact@v4
        with:
          name: dataset-stats
          path: data/processed/stats.json
